default_install_hook_types:
  - pre-commit
  - commit-msg
  - prepare-commit-msg
  - pre-push

repos:
  - repo: local
    hooks:
      - id: test
        name: npm test
        entry: npm test
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: lint
        name: npm run lint
        entry: npm run lint
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: commitlint
        name: commitlint
        entry: npx --no -- commitlint --edit
        language: system
        stages: [commit-msg]

      - id: prepare-commit-msg
        name: append issue reference from branch name
        entry: node scripts/prepare-commit-msg.js
        language: system
        stages: [prepare-commit-msg]

      - id: coverage
        name: npm run coverage
        entry: npm run coverage
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
