name: pi NVIDIA Dogfood

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: Direct prompt to send to the NVIDIA-backed model
        required: false
        default: Say hello and identify the provider/model you are using.

jobs:
  nvidia:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '25'

      - name: Run pi-action with NVIDIA custom provider
        id: pi
        uses: ./
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          share_session: false
          output_mode: output
          prompt: ${{ github.event.inputs.prompt }}
          provider: nvidia
          model: openai/openai/gpt-5.5
          api_key: ${{ secrets.NVIDIA_API_KEY }}
          provider_base_url: https://inference-api.nvidia.com
          provider_api: openai-responses
          model_name: GPT-5.5 (OpenAI)
          model_reasoning: true
          model_input: text,image
          model_context_window: 1050000
          model_max_tokens: 16384

      - name: Print model response
        env:
          PI_SUCCESS: ${{ steps.pi.outputs.success }}
          PI_RESPONSE: ${{ steps.pi.outputs.response }}
        run: |
          printf 'success=%s\n' "$PI_SUCCESS"
          printf 'response<<EOF\n%s\nEOF\n' "$PI_RESPONSE"
