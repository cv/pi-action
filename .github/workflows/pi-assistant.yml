name: pi Assistant

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: pi-action-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  pi-response:
    if: contains(github.event.comment.body || github.event.issue.body || github.event.pull_request.body || '', '@pi')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '25'

      - name: Run pi-action
        uses: ./  # Dogfooding: use the action from this repo
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          share_session: false
          provider: nvidia
          model: openai/openai/gpt-5.5
          api_key: ${{ secrets.NVIDIA_API_KEY }}
          provider_base_url: https://inference-api.nvidia.com
          provider_api: openai-responses
          model_name: GPT-5.5 (OpenAI)
          model_reasoning: true
          model_input: text,image
          model_context_window: 1050000
          model_max_tokens: 16384
