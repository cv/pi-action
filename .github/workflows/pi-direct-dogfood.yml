name: pi Direct Dogfood

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: Direct prompt to send to pi
        required: true
        default: Summarize this repository in one paragraph.

jobs:
  direct:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '25'

      - name: Run pi-action in output mode
        id: pi
        uses: ./
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          share_session: false
          output_mode: output
          prompt: ${{ github.event.inputs.prompt }}
          provider: nvidia
          model: openai/openai/gpt-5.5
          api_key: ${{ secrets.NVIDIA_API_KEY }}
          provider_base_url: https://inference-api.nvidia.com
          provider_api: openai-responses
          model_name: GPT-5.5 (OpenAI)
          model_reasoning: true
          model_input: text,image
          model_context_window: 1050000
          model_max_tokens: 16384

      - name: Print outputs
        run: |
          echo "success=${{ steps.pi.outputs.success }}"
          echo "share_url=${{ steps.pi.outputs.share_url }}"
          echo "response<<EOF"
          echo "${{ steps.pi.outputs.response }}"
          echo "EOF"
