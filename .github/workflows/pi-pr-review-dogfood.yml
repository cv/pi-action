name: pi PR Review Dogfood

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review
        required: true
      prompt:
        description: Review instructions
        required: false
        default: Review this PR and summarize risks, bugs, and test gaps.

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '25'

      - name: Run pi-action on explicit PR
        id: pi
        uses: ./
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          share_session: true
          output_mode: output
          pr_number: ${{ github.event.inputs.pr_number }}
          prompt: ${{ github.event.inputs.prompt }}
          provider: nvidia
          model: openai/openai/gpt-5.5
          api_key: ${{ secrets.NVIDIA_API_KEY }}
          provider_base_url: https://inference-api.nvidia.com
          provider_api: openai-responses
          model_name: GPT-5.5 (OpenAI)
          model_reasoning: true
          model_input: text,image
          model_context_window: 1050000
          model_max_tokens: 16384

      - name: Print review summary
        env:
          PI_SUCCESS: ${{ steps.pi.outputs.success }}
          PI_SHARE_URL: ${{ steps.pi.outputs.share_url }}
          PI_RESPONSE: ${{ steps.pi.outputs.response }}
        run: |
          printf 'success=%s\n' "$PI_SUCCESS"
          printf 'share_url=%s\n' "$PI_SHARE_URL"
          printf 'response<<EOF\n%s\nEOF\n' "$PI_RESPONSE"
