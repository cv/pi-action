name: 'pi-action'
description: 'Invoke the pi coding agent on GitHub issues and PRs via comment triggers'
author: 'Carlos Villela'
branding:
  icon: 'cpu'
  color: 'purple'

inputs:
  github_token:
    description: 'GitHub token for API access'
    required: true
  pi_auth_json:
    description: 'Contents of ~/.pi/agent/auth.json for OAuth authentication'
    required: false
  trigger_phrase:
    description: 'Phrase to trigger pi (e.g., @pi)'
    default: '@pi'
  allowed_bots:
    description: 'Comma-separated list of allowed bot usernames'
    default: ''
  timeout:
    description: 'Execution timeout in seconds'
    default: '300'
  provider:
    description: 'LLM provider (anthropic, openai, google, etc.)'
    default: 'anthropic'
  model:
    description: 'Model ID'
    default: 'claude-sonnet-4-20250514'

runs:
  using: 'composite'
  steps:
    - name: Install action dependencies
      shell: bash
      run: npm ci --prefix ${{ github.action_path }}
    
    - name: Install repository git hooks
      shell: bash
      run: |
        # Install husky and commitlint in the target repository if it has a package.json
        if [ -f "package.json" ]; then
          echo "📦 Installing git hooks in target repository..."
          
          # Check if husky is already a dependency
          if grep -q '"husky"' package.json; then
            echo "Husky already in package.json, running npm ci to install hooks..."
            npm ci
          else
            echo "Adding husky and commitlint as dev dependencies..."
            npm install --save-dev husky @commitlint/cli @commitlint/config-conventional
            
            # Initialize husky
            npx husky init
          fi
          
          # Copy hook files from action to target repo if they don't exist
          ACTION_HOOKS="${{ github.action_path }}/.husky"
          TARGET_HOOKS=".husky"
          
          if [ -d "$ACTION_HOOKS" ]; then
            mkdir -p "$TARGET_HOOKS"
            
            for hook in pre-commit commit-msg prepare-commit-msg pre-push; do
              if [ -f "$ACTION_HOOKS/$hook" ] && [ ! -f "$TARGET_HOOKS/$hook" ]; then
                echo "Installing $hook hook..."
                cp "$ACTION_HOOKS/$hook" "$TARGET_HOOKS/$hook"
                chmod +x "$TARGET_HOOKS/$hook"
              fi
            done
          fi
          
          # Copy commitlint config if it doesn't exist
          if [ -f "${{ github.action_path }}/commitlint.config.js" ] && [ ! -f "commitlint.config.js" ]; then
            echo "Installing commitlint config..."
            cp "${{ github.action_path }}/commitlint.config.js" ./
          fi
          
          echo "✅ Git hooks installed!"
        else
          echo "⚠️ No package.json found, skipping git hooks installation"
        fi
    
    - name: Run pi-action
      shell: bash
      run: node ${{ github.action_path }}/dist/index.js
      env:
        INPUT_GITHUB_TOKEN: ${{ inputs.github_token }}
        INPUT_PI_AUTH_JSON: ${{ inputs.pi_auth_json }}
        INPUT_TRIGGER_PHRASE: ${{ inputs.trigger_phrase }}
        INPUT_ALLOWED_BOTS: ${{ inputs.allowed_bots }}
        INPUT_TIMEOUT: ${{ inputs.timeout }}
        INPUT_PROVIDER: ${{ inputs.provider }}
        INPUT_MODEL: ${{ inputs.model }}
